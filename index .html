<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda</title>
  <meta name="description" content="Agenda de clientes e agendamentos">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="titulo">Agenda</h1>
    <p id="subtitulo"></p>
  </header>

  <main id="view"></main>

  <button type="button" class="fab" id="fab" data-action="fab" aria-label="Adicionar">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="Navegação principal">
    <button type="button" data-action="aba" data-aba="agenda" class="on">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Agenda</span>
    </button>
    <button type="button" data-action="aba" data-aba="clientes">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 5.2a3.4 3.4 0 010 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>
      <span>Clientes</span>
    </button>
    <button type="button" data-action="aba" data-aba="backup">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 16v2.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V16"/></svg>
      <span>Backup</span>
    </button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="arquivoImport" class="oculto" accept="application/json,.json" tabindex="-1" aria-hidden="true">

  <script src="app.js"></script>
</body>
</html>
